<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原创 fixture · MCP iframe 高度验证</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e4e9ed;
        font: 14px system-ui;
      }
      .controls {
        padding: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      input {
        max-width: 130px;
      }
      iframe {
        display: block;
        width: 100%;
        height: 150px;
        border: 0;
      }
      #sidebar {
        display: none;
        height: 100dvh;
      }
      body[data-sidebar-open='true'] #sidebar {
        display: block;
      }
      body[data-mode='fullscreen'] iframe {
        height: 100dvh;
      }
      output {
        display: block;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label>查询<input id="query" value="记录员" /></label>
      <label
        >方式<select id="by">
          <option value="character">人物</option>
          <option value="story">剧情</option>
        </select></label
      >
      <button id="deliver">交付结果</button>
      <button id="failure">模拟网络失败</button>
      <button id="inline">切回内嵌</button>
      <button id="fullscreen">切到全屏</button>
      <button id="theme">切换主题</button>
      <label><input id="deny" type="checkbox" />拒绝全屏</label>
      <label><input id="deny-link" type="checkbox" />拒绝侧栏跳转</label>
      <label>侧栏路径<input id="route" value="/" /></label>
      <button id="navigate">发送侧栏链接</button>
    </div>
    <iframe id="app" title="原创 MCP 搜索验证"></iframe>
    <iframe id="sidebar" title="原创 MCP 侧栏阅读器"></iframe>
    <output id="opened-link" aria-label="打开的深链"></output>
    <output id="sidebar-loads" aria-label="侧栏加载次数">0</output>
    <output id="status" role="status">正在连接原创 fixture</output>
    <output id="sizes" aria-label="尺寸通知">[]</output>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
