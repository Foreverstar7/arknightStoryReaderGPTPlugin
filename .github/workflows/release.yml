name: Publish release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == false && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - name: Verify Release assets and publish the accepted archive to npm latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:publish
      - name: Commit the fixed marketplace and publishing receipt
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/plugins/marketplace.json docs/releases/*.json
          if ! git diff --cached --quiet; then
            git commit -m "release: complete $GITHUB_REF_NAME npm and marketplace publication"
            git push origin HEAD:main
          fi
          echo "Completed $GITHUB_REF_NAME: npm latest and the fixed marketplace are published. Installed plugins update only when users refresh and install." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-publication-receipt
          include-hidden-files: true
          path: .local/published/published.json
          if-no-files-found: ignore
          retention-days: 30
