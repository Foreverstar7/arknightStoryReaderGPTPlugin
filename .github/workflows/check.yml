name: Check
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: npm run package:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:host
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check-evidence
          path: |
            .local/releases/*.json
            .local/releases/npm-install-logs/
            test-results/fixture/
            .ai/local/search-card-check/host-report.json
            .ai/local/search-card-check/results/
            .ai/local/search-card-check/*.png
          overwrite: true
          include-hidden-files: true
          retention-days: 14
  prepare-release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/prepare-release.yml
    with:
      source_sha: ${{ github.sha }}
