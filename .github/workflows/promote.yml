name: Promote stable marketplace
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published exact version, e.g. 0.1.26 (without v)'
        required: true
        type: string
      host_evidence:
        description: 'HTTPS evidence URL: Windows x64 Codex npm install, entry, reading, resume, uninstall'
        required: true
        type: string
      host_accepted:
        description: 'I verified this exact npm version in the real Codex desktop host'
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: stable-marketplace
  cancel-in-progress: false
jobs:
  promote:
    if: inputs.host_accepted && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - name: Validate input and retrieve successful publishing receipt
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node -e "if(!/^\d+\.\d+\.\d+$/.test(process.env.VERSION)) process.exit(1)"
          mkdir -p .local/promotion
          gh release download "v$VERSION" --pattern published.json --dir .local/promotion
      - name: Verify registry and prepare fixed source
        env:
          VERSION: ${{ inputs.version }}
          HOST_EVIDENCE: ${{ inputs.host_evidence }}
          HOST_ACCEPTED: ${{ inputs.host_accepted }}
        run: npm run marketplace:promote -- "$VERSION"
      - name: Commit accepted version, then publish release notes
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'Foreverstar7'
          git config user.email 'foreverstar717@gmail.com'
          git add .agents/plugins/marketplace.json "docs/releases/$VERSION.json"
          if ! git diff --cached --quiet; then
            git commit -m "release: promote reader $VERSION after host acceptance"
            git push origin HEAD:main
          fi
          gh release edit "v$VERSION" --draft=false --title "v$VERSION" --notes-file .local/promotion/notes.md
