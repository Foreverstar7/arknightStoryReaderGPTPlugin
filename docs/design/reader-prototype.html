  }
  root.addEventListener('click',async event => {
    const button = event.target.closest('button[data-act]');
    const clickedName = event.target.closest('[data-act="name"]');
    if (!portrait.contains(event.target) && !clickedName) hidePortrait();
    if (view.page === 'reader' && current.dataset.indexOpen === 'true' && !event.target.closest('.am-read-index,[data-act="toggle-index"]')) { current.dataset.indexOpen = 'false'; current.querySelectorAll('[data-act="toggle-index"]').forEach(item => item.setAttribute('aria-expanded','false')); }
    if (!button || !root.contains(button) || button.disabled || busy) return;
    const action = button.dataset.act;
    if (action === 'book') await goContents(button.dataset.book,button);
    else if (action === 'home') { closeSettings(); await goHome(); }
    else if (action === 'contents') { closeSettings(); if (view.bookId) await goContents(view.bookId); }
    else if (action === 'recent-read') { const recent = recentReading(); closeSettings(); if (recent) await goReader(recent.last.chapter,true,recent.book.id,button); }
    else if (action === 'chapter') await goReader(Number(button.dataset.chapter));
    else if (action === 'continue') { const last = records[view.bookId].last; if (last) await goReader(last.chapter,true); }
    else if (action === 'previous') await goReader(view.chapter-1);
    else if (action === 'next') await goReader(view.chapter+1);
    else if (action === 'category') {
      const scroller = current.querySelector('.am-home-scroll'), section = current.querySelector('[data-category-section="'+button.dataset.category+'"]');
      scroller.scrollTo({top:section.offsetTop-20,behavior:reducedMotion.matches ? 'instant' : 'smooth'});
    }
    else if (action === 'toggle-index') { const open = current.dataset.indexOpen !== 'true'; current.dataset.indexOpen = String(open); current.querySelectorAll('[data-act="toggle-index"]').forEach(item => item.setAttribute('aria-expanded',String(open))); }
    else if (action === 'settings') showSettings();
    else if (action === 'close-settings') closeSettings();
    else if (action === 'history') showSettings('history');
    else if (action === 'history-read') { const id = button.dataset.book, last = records[id].last; closeSettings(); if (last) await goReader(last.chapter,true,id); }
    else if (action === 'name') { const box = button.closest('.am-namebox'); if (!portrait.hidden && portrait.dataset.owner === box.dataset.personId) hidePortrait(); else showPortrait(box); }
    else if (action === 'close-portrait') hidePortrait();
    else if (action === 'cg') {
      const block = button.closest('[data-cg]'), art = block.querySelector('.am-cg-art');
      if (art.hidden) showCg(block); else { const anchor = currentWord(); readerRestoring = true; art.hidden = true; button.innerHTML = icon('image')+'查看 CG'; icons(); requestAnimationFrame(() => { setWord(current,anchor); readerRestoring = false; }); }
    }
    else if (action === 'refresh') { updateReading(); settingsPanel.querySelector('.am-message').textContent = '示例正文已刷新，阅读位置已保留。'; }
    else if (action === 'clear-images' || action === 'clear-content') { pictureCache.clear(); showSettings(); settingsPanel.querySelector('.am-message').textContent = '示例缓存已清理，阅读记录和进度保留。'; }
    else if (action === 'ask-clear-history') settingsPanel.querySelector('.am-clear-confirm').hidden = false;
    else if (action === 'cancel-clear-history') settingsPanel.querySelector('.am-clear-confirm').hidden = true;
    else if (action === 'clear-history') {
      closeSettings(); if (view.page !== 'home') await goHome();
      books.forEach(book => { records[book.id] = {max:book.chapters.map(() => 0),last:null}; });
      updateHeader(); announce('示例阅读记录已清除'); save();
    }
  });
  root.addEventListener('change',event => {
    if (event.target.dataset.pref === 'images') { autoImages = event.target.checked; save(); }
    if (event.target.dataset.pref === 'days') { keepDays = Math.max(1,Math.min(365,Number(event.target.value) || 7)); event.target.value = keepDays; save(); }
  });
  shade.addEventListener('click',event => { if (event.target === shade) closeSettings(); });
  root.addEventListener('keydown',event => {
    if (event.key === 'Escape') { if (!portrait.hidden) hidePortrait(); else if (!shade.hidden) closeSettings(); else if (view.page === 'reader') { current.dataset.indexOpen = 'false'; current.querySelectorAll('[data-act="toggle-index"]').forEach(item => item.setAttribute('aria-expanded','false')); } }
    if (event.key === 'Tab' && !shade.hidden) {
      const controls = [...settingsPanel.querySelectorAll('button,input')].filter(item => !item.disabled && !item.closest('[hidden]'));
      const first = controls[0], last = controls[controls.length-1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
    }
  });
  function applyDesign() {
    app.style.setProperty('--am-copy-size',design.textSize+'px');
    app.style.colorScheme = design.theme === '深色档案' ? 'dark' : design.theme === '纸感浅色' ? 'light' : 'light dark';
  }
  function acceptState(incoming) {
    if (!validSaved(incoming)) return;
    books.forEach(book => {
      const rec = incoming.records[book.id];
      if (!rec || !Array.isArray(rec.max)) return;
      records[book.id].max = book.chapters.map((chapter,i) => Math.max(0,Math.min(chapter.total,Number(rec.max[i]) || 0)));
      records[book.id].last = rec.last && Number.isInteger(rec.last.chapter) && book.chapters[rec.last.chapter] ? {chapter:rec.last.chapter,word:Math.max(0,Math.min(book.chapters[rec.last.chapter].total,Number(rec.last.word) || 0))} : null;
      records[book.id].touched = Number(rec.touched) || 0;
    });
    autoImages = !!incoming.autoImages;
    keepDays = Math.max(1,Math.min(365,Number(incoming.keepDays) || 7));
    if (incoming.design) {
      design.expand = Math.max(280,Math.min(900,Number(incoming.design.expand) || 560));
      design.reveal = Math.max(220,Math.min(800,Number(incoming.design.reveal) || 480));
      design.textSize = Math.max(15,Math.min(21,Number(incoming.design.textSize) || 17));
      if (['空间延展','轻柔过渡'].includes(incoming.design.motion)) design.motion = incoming.design.motion;
      if (['跟随系统','深色档案','纸感浅色'].includes(incoming.design.theme)) design.theme = incoming.design.theme;
    }
    applyDesign(); updateHeader();
  }
  acceptState(saved);
  if (validSaved(saved)) {
    homeScroll = Math.max(0,Number(saved.homeScroll) || 0);
    if (saved.timelineScroll && typeof saved.timelineScroll === 'object') timelineScroll = saved.timelineScroll;
    if (saved.view && ['home','chapters','reader'].includes(saved.view.page) && (saved.view.page === 'home' || (bookById(saved.view.bookId) && bookById(saved.view.bookId).chapters[saved.view.chapter]))) view = {...saved.view};
  }
  current = applyView(view); stage.append(current); current._restoreScroll?.(); icons(); applyDesign();
  if (view.page === 'reader') bindReader(current,records[view.bookId].last?.chapter === view.chapter ? records[view.bookId].last.word : 0);
  window.addEventListener('openai:set_globals',event => {
    const incoming = event.detail?.globals?.widgetState?.privateContent;
    if (!busy && incoming && incoming.owner !== stateOwner && incoming !== saved) { saved = incoming; acceptState(incoming); }
  });
  document.addEventListener('pointerdown',event => { if (!root.contains(event.target)) hidePortrait(); });
  window.addEventListener('blur',hidePortrait);
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root,onChange:() => { applyDesign(); save(); }});
    tweak.addSelect(design,'motion',{label:'页面过渡',options:['空间延展','轻柔过渡']});
    tweak.addSlider(design,'expand',{label:'封面移动时长',min:280,max:900,step:20,unit:'ms'});
    tweak.addSlider(design,'reveal',{label:'正文揭幕时长',min:220,max:800,step:20,unit:'ms'});
    tweak.addSlider(design,'textSize',{label:'对白字号',min:15,max:21,unit:'px'});
    tweak.addSelect(design,'theme',{label:'界面气质',options:['跟随系统','深色档案','纸感浅色']});
  }
})();
</script>
</div>
